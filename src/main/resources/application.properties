spring.application.name=daily-english-agent

# Server Configuration
server.port=8090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/englishWordsDB
spring.datasource.username=regular_user
spring.datasource.password=this_is_a_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ollama Configuration
# Local dev:  uses 127.0.0.1 to bypass VPN (NordVPN) DNS interception.
# Docker:     OLLAMA_BASE_URL env var overrides this to http://host.docker.internal:11434
ollama.base.url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model.name=gemma4:e4b
#ollama.model.name=mistral:latest
# Timeout for a single Ollama generate request.
# Set generously ? LLM responses via Docker host networking can be slow.
# Must be higher than the Ktor HttpTimeout requestTimeoutMillis (they are kept in sync).
# Increased to 180s for gemma4:e4b (larger model, requires more generation time)
ollama.timeout.seconds=180

# Vocabulary Fetch Configuration
# Server timezone must be America/New_York for the 7 AM cron to fire correctly.
# Local dev override:  set VOCABULARY_FETCH_CRON=0 */5 * * * * for 5-minute testing.
# Docker override:     set VOCABULARY_FETCH_CRON in docker-compose.yml environment block.
vocabulary.fetch.cron=${VOCABULARY_FETCH_CRON:0 0 7 * * *}
vocabulary.retry.max.attempts=5
vocabulary.retry.delay.seconds=10

# Ktor Configuration
ktor.port=8091

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Discord Configuration
# Local dev: values are read directly from this file.
# Docker:    DISCORD_BOT_TOKEN and DISCORD_CHANNEL_ID are injected via docker-compose.yml
#            environment block (sourced from the .env file at project root).
discord.bot.token=${BOT_TOKEN}
discord.channel.id=${CHANNEL_ID}
discord.enabled=true
# Set to true to add [TEST] prefix to Discord messages during development
discord.test.mode=${DISCORD_TEST_MODE:false}
discord.test.prefix=[TEST]
# Retry configuration for Discord posting (handles VPN latency)
discord.retry.max.attempts=5
discord.retry.delay.seconds=3
